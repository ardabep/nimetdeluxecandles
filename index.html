<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nimet Luxe Candles | El Yapımı Premium Mum Koleksiyonu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
          --color-bg: #1a1816;           
          --color-surface: #211e1c;      
          --color-primary: #d4af37;      
          --color-accent: #fcfbfa;       
          --color-text-primary: #f5f2ed;  
          --color-text-secondary: #aaa39a;
          --color-border: rgba(212, 175, 55, 0.12); 
          --font-display: 'Cormorant Garamond', serif; 
          --font-body: 'Plus Jakarta Sans', sans-serif;
          --space-md: 16px; --space-lg: 24px; --space-xl: 40px;
          --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
          --transition-smooth: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        
        body { 
          background-color: var(--color-bg); 
          color: var(--color-text-primary); 
          font-family: var(--font-body); 
          overflow-x: hidden; 
          -webkit-font-smoothing: antialiased; 
          padding-top: 70px;
        }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 0 var(--space-lg); position: relative; z-index: 2; }
        
        .nav { 
          position: fixed; top: 0; width: 100%; z-index: 100; padding: var(--space-md) 0; 
          backdrop-filter: blur(25px); background: rgba(26, 24, 22, 0.9); 
          border-bottom: 1px solid rgba(212, 175, 55, 0.08); transition: var(--transition-smooth);
        }
        .nav-container { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: var(--font-display); font-size: 24px; font-weight: 600; color: var(--color-primary); text-decoration: none; letter-spacing: 0.08em; }
        
        .nav-links { display: flex; gap: var(--space-lg); align-items: center; }
        .nav-links a { color: var(--color-text-secondary); text-decoration: none; font-size: 13px; font-weight: 500; transition: var(--transition-smooth); position: relative; letter-spacing: 0.03em; }
        .nav-links a::after { content: ''; position: absolute; width: 0; height: 1px; bottom: -4px; left: 0; background-color: var(--color-primary); transition: var(--transition-smooth); }
        .nav-links a:hover { color: var(--color-accent); }
        .nav-links a:hover::after { width: 100%; }
        
        .nav .cart-trigger { background: transparent; border: 1px solid var(--color-primary); color: var(--color-primary); padding: 10px 20px; font-family: var(--font-body); cursor: pointer; font-weight: 600; font-size: 12px; transition: var(--transition-smooth); letter-spacing: 0.05em; }
        .nav .cart-trigger:hover { background: var(--color-primary); color: var(--color-bg); transform: scale(1.03); }
        
        .mobile-bottom-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
            width: calc(100% - 40px); max-width: 400px; background: rgba(33, 30, 28, 0.95);
            backdrop-filter: blur(20px); border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 40px; padding: 14px 28px; display: none; justify-content: space-between;
            align-items: center; z-index: 150; box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            animation: slideUpBar 1s var(--ease-out-expo) forwards 0.5s;
        }
        @keyframes slideUpBar { to { transform: translateX(-50%) translateY(0); } }
        .mobile-bar-brand { font-family: var(--font-display); font-size: 18px; color: var(--color-accent); text-decoration: none; font-weight: 600; letter-spacing: 0.05em; }
        .mobile-cart-btn {
            background: var(--color-primary); color: var(--color-bg); border: none; padding: 8px 20px; border-radius: 20px;
            font-family: var(--font-body); font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: var(--transition-smooth);
        }
        
        .hero { height: calc(100vh - 70px); display: flex; align-items: center; position: relative; overflow: hidden; }
        .hero-bg-image {
          position: absolute; top: 0; left: 0; width: 100%; height: 100%;
          background-image: url('https://images.unsplash.com/photo-1603006905003-be475563bc59?q=80&w=1920&auto=format&fit=crop');
          background-size: cover; background-position: center; z-index: 1;
          transform: scale(1.05); animation: luxuryZoom 25s infinite alternate ease-in-out;
        }
        .hero-overlay {
          position: absolute; top: 0; left: 0; width: 100%; height: 100%;
          background: linear-gradient(to bottom, rgba(26, 24, 22, 0.4) 0%, rgba(26, 24, 22, 0.65) 60%, var(--color-bg) 100%);
          z-index: 1;
        }
        .hero-wrapper { width: 100%; position: relative; z-index: 3; }
        .hero-text { max-width: 650px; }
        .hero h1 { font-family: var(--font-display); font-size: clamp(2.5rem, 5vw + 1rem, 4.5rem); font-weight: 400; color: var(--color-accent); margin-bottom: var(--space-md); line-height: 1.15; letter-spacing: -0.01em; }
        .hero p { font-size: 16px; color: var(--color-text-secondary); margin-bottom: var(--space-xl); line-height: 1.7; font-weight: 300; }
        
        @keyframes luxuryZoom { 0% { transform: scale(1.02) rotate(0deg); } 100% { transform: scale(1.08) rotate(0.5deg); } }
        
        .btn-primary { display: inline-flex; padding: 16px 36px; background: var(--color-primary); color: var(--color-bg); text-decoration: none; font-weight: 600; letter-spacing: 0.1em; font-size: 12px; text-transform: uppercase; transition: var(--transition-smooth); border: none; cursor: pointer; }
        .btn-primary:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(212, 175, 55, 0.25); background: var(--color-accent); color: var(--color-bg); }
        
        .section-header { text-align: center; margin-bottom: 50px; }
        .section-subtitle { color: var(--color-primary); text-transform: uppercase; font-size: 11px; letter-spacing: 0.25em; margin-bottom: 10px; display: block; font-weight: 600; }
        .section-title { font-family: var(--font-display); font-size: 36px; font-weight: 400; letter-spacing: 0.03em; color: var(--color-accent); }
        
        .scroll-animate { opacity: 0; transform: translateY(40px) scale(0.98); transition: opacity 1.2s var(--ease-out-expo), transform 1.2s var(--ease-out-expo); }
        .scroll-animate.active { opacity: 1; transform: translateY(0) scale(1); }
        
        .section-block { padding: 90px 0; border-bottom: 1px solid rgba(212, 175, 55, 0.05); position: relative; z-index: 2; }
        .grid { display: grid; gap: var(--space-xl); grid-template-columns: repeat(3, 1fr); }
        
        .card { 
          background: var(--color-surface); border: 1px solid rgba(212, 175, 55, 0.04); 
          padding: var(--space-md); transition: var(--transition-smooth); 
          display: flex; flex-direction: column; position: relative;
        }
        .card:hover { transform: translateY(-12px) scale(1.01); border-color: rgba(212, 175, 55, 0.3); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6); }
        
        .product-img-box { 
          width: 100%; height: 280px; background: #191715; display: flex; align-items: center; 
          justify-content: center; margin-bottom: var(--space-md); color: rgba(212, 175, 55, 0.35); 
          font-family: var(--font-display); font-style: italic; font-size: 22px; letter-spacing: 0.05em;
          border: 1px solid rgba(212, 175, 55, 0.02); transition: var(--transition-smooth); overflow: hidden;
        }
        .card:hover .product-img-box { color: var(--color-primary); background: #141311; transform: scale(0.99); }
        
        .product-title { font-family: var(--font-display); font-size: 24px; font-weight: 400; margin-bottom: 8px; color: var(--color-accent); letter-spacing: 0.02em; }
        .product-desc { font-size: 13px; color: var(--color-text-secondary); line-height: 1.6; margin-bottom: var(--space-md); flex-grow: 1; font-weight: 300; }
        .product-footer { display: flex; justify-content: space-between; align-items: center; padding-top: var(--space-md); border-top: 1px solid rgba(212, 175, 55, 0.08); }
        .product-price { font-weight: 600; color: var(--color-primary); font-size: 18px; font-family: var(--font-body); }
        
        .btn-add-cart { background: transparent; border: 1px solid rgba(212, 175, 55, 0.25); color: var(--color-primary); padding: 10px 22px; font-size: 12px; cursor: pointer; transition: var(--transition-smooth); font-weight: 600; letter-spacing: 0.05em; }
        .btn-add-cart:hover { background: var(--color-primary); color: var(--color-bg); transform: scale(1.05); }
        
        /* Kart ekleri, Footer, vs. (Dosyadan gelen CSS'in devamı...) */
        .cart-sidebar { position: fixed; top: 0; right: -440px; width: 420px; height: 100%; background: #1e1c1a; border-left: 1px solid rgba(212, 175, 55, 0.12); z-index: 200; padding: var(--space-xl); display: flex; flex-direction: column; transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), right 0.6s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: -20px 0 50px rgba(0,0,0,0.7); }
        .cart-sidebar.open { right: 0; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-xl); border-bottom: 1px solid rgba(212, 175, 55, 0.08); padding-bottom: var(--space-md); }
        .btn-whatsapp { width: 100%; padding: 15px; background: #25D366; color: white; border: none; font-weight: 600; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 4px; transition: opacity 0.3s, transform 0.2s; }
        
        @media (max-width: 992px) { .mobile-bottom-bar { display: flex; } }
    </style>
</head>
<body>
    <nav class="nav">...</nav>
    <script>
        const urunler = [
          { id: 1, ad: "Nimet Luxe Siyah Amber", aciklama: "Odanızı anında saracak yoğun gizemli amber ve odunsu esanslar. Özel lüks antrasit cam tasarım.", fiyat: 350 },
          { id: 2, ad: "Oryantal Vanilya & Sandal Ağacı", aciklama: "Tatlı gurme vanilya notaları ile sandal ağacının büyüleyici, sakinleştirici meditasyon enerjisi.", fiyat: 380 },
          { id: 3, ad: "Egzotik Lavanta Bahçesi", aciklama: "Günün stresini tamamen azaltan, saf organik lavanta yağları ile harmanlanmış dinlendirici mum.", fiyat: 320 },
          { id: 4, ad: "Lavanta Düşleri Bubble Buket", aciklama: "Morun en asil tonlarıyla hazırlanan, el işçiliği çiçek figürlerinin tül ve altın detaylarla buluştuğu premium dekoratif mum aranjmanı.", fiyat: 2000 }
        ];

        // ... (Diğer tüm orijinal fonksiyonlar ve sepet mantığı aynı kalmıştır)
        function urunleriListele() {
          const lb = document.getElementById('product-list'); 
          if(!lb) return;
          lb.innerHTML = urunler.map(u => `
            <div class="card">
                <div class="product-img-box">Nimet Luxe</div>
                <h3 class="product-title">${u.ad}</h3>
                <p class="product-desc">${u.aciklama}</p>
                <div class="product-footer">
                    <span class="product-price">${u.fiyat} TL</span>
                    <button class="btn-add-cart" onclick="sepeteEkle(${u.id})">Sepete Ekle</button>
                </div>
            </div>`).join('');
        }
        
        // ... (Geri kalan scriptler)
    </script>
</body>
</html>
