<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nimet Luxe Candles | El Yapımı Premium Mum Koleksiyonu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        :root {
          --color-bg: #1a1816;           
          --color-surface: #211e1c;      
          --color-primary: #d4af37;      
          --color-accent: #fcfbfa;       
          --color-text-primary: #f5f2ed;  
          --color-text-secondary: #aaa39a;
          --color-border: rgba(212, 175, 55, 0.12); 
          --font-display: 'Cormorant Garamond', serif; 
          --font-body: 'Plus Jakarta Sans', sans-serif;
          --space-md: 16px; --space-lg: 24px; --space-xl: 40px;
          --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
          --transition-smooth: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        
        body { 
          background-color: var(--color-bg); 
          color: var(--color-text-primary); 
          font-family: var(--font-body); 
          overflow-x: hidden; 
          -webkit-font-smoothing: antialiased; 
          padding-top: 70px;
        }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 0 var(--space-lg); position: relative; z-index: 2; }
        
        .nav { 
          position: fixed; top: 0; width: 100%; z-index: 100; padding: var(--space-md) 0; 
          backdrop-filter: blur(25px); background: rgba(26, 24, 22, 0.9); 
          border-bottom: 1px solid rgba(212, 175, 55, 0.08); transition: var(--transition-smooth);
        }
        .nav-container { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: var(--font-display); font-size: 24px; font-weight: 600; color: var(--color-primary); text-decoration: none; letter-spacing: 0.08em; }
        
        .nav-links { display: flex; gap: var(--space-lg); align-items: center; }
        .nav-links a { color: var(--color-text-secondary); text-decoration: none; font-size: 13px; font-weight: 500; transition: var(--transition-smooth); position: relative; letter-spacing: 0.03em; }
        .nav-links a::after { content: ''; position: absolute; width: 0; height: 1px; bottom: -4px; left: 0; background-color: var(--color-primary); transition: var(--transition-smooth); }
        .nav-links a:hover { color: var(--color-accent); }
        .nav-links a:hover::after { width: 100%; }
        
        .nav .cart-trigger { background: transparent; border: 1px solid var(--color-primary); color: var(--color-primary); padding: 10px 20px; font-family: var(--font-body); cursor: pointer; font-weight: 600; font-size: 12px; transition: var(--transition-smooth); letter-spacing: 0.05em; }
        .nav .cart-trigger:hover { background: var(--color-primary); color: var(--color-bg); transform: scale(1.03); }
        
        .mobile-bottom-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
            width: calc(100% - 40px); max-width: 400px; background: rgba(33, 30, 28, 0.95);
            backdrop-filter: blur(20px); border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 40px; padding: 14px 28px; display: none; justify-content: space-between;
            align-items: center; z-index: 150; box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            animation: slideUpBar 1s var(--ease-out-expo) forwards 0.5s;
        }
        @keyframes slideUpBar { to { transform: translateX(-50%) translateY(0); } }
        .mobile-bar-brand { font-family: var(--font-display); font-size: 18px; color: var(--color-accent); text-decoration: none; font-weight: 600; letter-spacing: 0.05em; }
        .mobile-cart-btn {
            background: var(--color-primary); color: var(--color-bg); border: none; padding: 8px 20px; border-radius: 20px;
            font-family: var(--font-body); font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: var(--transition-smooth);
        }
        
        .hero { height: calc(100vh - 70px); display: flex; align-items: center; position: relative; overflow: hidden; }
        .hero-bg-image {
          position: absolute; top: 0; left: 0; width: 100%; height: 100%;
          background-image: url('https://images.unsplash.com/photo-1603006905003-be475563bc59?q=80&w=1920&auto=format&fit=crop');
          background-size: cover; background-position: center; z-index: 1;
          transform: scale(1.05); animation: luxuryZoom 25s infinite alternate ease-in-out;
        }
        .hero-overlay {
          position: absolute; top: 0; left: 0; width: 100%; height: 100%;
          background: linear-gradient(to bottom, rgba(26, 24, 22, 0.4) 0%, rgba(26, 24, 22, 0.65) 60%, var(--color-bg) 100%);
          z-index: 1;
        }
        .hero-wrapper { width: 100%; position: relative; z-index: 3; }
        .hero-text { max-width: 650px; }
        .hero h1 { font-family: var(--font-display); font-size: clamp(2.5rem, 5vw + 1rem, 4.5rem); font-weight: 400; color: var(--color-accent); margin-bottom: var(--space-md); line-height: 1.15; letter-spacing: -0.
