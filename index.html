<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nimet Luxe Candles | El Yapımı Premium Mum Koleksiyonu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
          /* Yeni Aydınlık Tema Renk Paleti */
          --color-bg: #fdfbf7;           /* Krem / Fildişi Arka Plan */
          --color-surface: #ffffff;      /* Net Beyaz Kartlar ve Yüzeyler */
          --color-primary: #b89028;      /* Daha Net Okunabilen Yumuşak Altın */
          --color-accent: #2c2520;       /* Koyu Kahve / Vizon Detay Kontrastı */
          --color-text-primary: #3d3530;  /* Koyu Vizon Gövde Metni */
          --color-text-secondary: #7a7068;/* Orta Ton Gri-Kahve Yardımcı Metin */
          --color-border: rgba(184, 144, 40, 0.15); 
          --font-display: 'Cormorant Garamond', serif; 
          --font-body: 'Plus Jakarta Sans', sans-serif;
          --space-md: 16px; --space-lg: 24px; --space-xl: 40px;
          
          /* Lüks ve pürüzsüz geçişler için özel sinematik ivme eğrisi */
          --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
          --transition-smooth: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* Sayfa içi link kaydırmalarını yumuşattık */
        html { scroll-behavior: smooth; }
        
        body { 
          background-color: var(--color-bg); 
          color: var(--color-text-primary); 
          font-family: var(--font-body); 
          overflow-x: hidden; 
          -webkit-font-smoothing: antialiased; 
          padding-top: 70px;
        }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 0 var(--space-lg); position: relative; z-index: 2; }
        
        /* Navigasyon */
        .nav { 
          position: fixed; 
          top: 0; 
          width: 100%; 
          z-index: 100; 
          padding: var(--space-md) 0; 
          backdrop-filter: blur(25px); 
          background: rgba(253, 251, 247, 0.9); /* Aydınlık şeffaf arka plan */
          border-bottom: 1px solid rgba(184, 144, 40, 0.1); 
          transition: var(--transition-smooth);
        }
        .nav-container { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: var(--font-display); font-size: 24px; font-weight: 600; color: var(--color-primary); text-decoration: none; letter-spacing: 0.08em; }
        
        .nav-links { display: flex; gap: var(--space-lg); align-items: center; }
        .nav-links a { color: var(--color-text-secondary); text-decoration: none; font-size: 13px; font-weight: 500; transition: var(--transition-smooth); position: relative; letter-spacing: 0.03em; }
        .nav-links a::after { content: ''; position: absolute; width: 0; height: 1px; bottom: -4px; left: 0; background-color: var(--color-primary); transition: var(--transition-smooth); }
        .nav-links a:hover { color: var(--color-accent); }
        .nav-links a:hover::after { width: 100%; }
        
        .nav .cart-trigger { background: transparent; border: 1px solid var(--color-primary); color: var(--color-primary); padding: 10px 20px; font-family: var(--font-body); cursor: pointer; font-weight: 600; font-size: 12px; transition: var(--transition-smooth); letter-spacing: 0.05em; }
        .nav .cart-trigger:hover { background: var(--color-primary); color: #ffffff; transform: scale(1.03); }
        
        /* Mobil Alt Bar */
        .mobile-bottom-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            width: calc(100% - 40px);
            max-width: 400px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(184, 144, 40, 0.25);
            border-radius: 40px;
            padding: 14px 28px;
            display: none; 
            justify-content: space-between;
            align-items: center;
            z-index: 150;
            box-shadow: 0 15px 35px rgba(61, 53, 48, 0.15);
            animation: slideUpBar 1s var(--ease-out-expo) forwards 0.5s;
        }
        @keyframes slideUpBar { to { transform: translateX(-50%) translateY(0); } }
        .mobile-bar-brand { font-family: var(--font-display); font-size: 18px; color: var(--color-accent); text-decoration: none; font-weight: 600; letter-spacing: 0.05em; }
        .mobile-cart-btn {
            background: var(--color-primary); color: #ffffff; border: none; padding: 8px 20px; border-radius: 20px;
            font-family: var(--font-body); font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: var(--transition-smooth);
        }
        .mobile-cart-btn:active { transform: scale(0.95); }
        
        /* Hero Alanı */
        .hero { height: calc(100vh - 70px); display: flex; align-items: center; position: relative; overflow: hidden; }
        .hero-bg-image {
          position: absolute; top: 0; left: 0; width: 100%; height: 100%;
          /* Gerçekçi ve aydınlık konsepte uygun premium mum görseli */
          background-image: url('https://images.unsplash.com/photo-1608571423902-eed4a5ad8108?q=80&w=1920&auto=format&fit=crop');
          background-size: cover; background-position: center; z-index: 1;
        }
        .hero-overlay {
          position: absolute; top: 0; left: 0; width: 100%; height: 100%;
          /* Aydınlık geçişi koruyan hafif soft matlık overlay'i */
          background: linear-gradient(to bottom, rgba(253, 251, 247, 0.1) 0%, rgba(253, 251, 247, 0.4) 60%, var(--color-bg) 100%);
          z-index: 1;
        }
        .hero-wrapper { width: 100%; position: relative; z-index: 3; }
        .hero-text { max-width: 650px; background: rgba(253, 251, 247, 0.85); padding: var(--space-xl); border-radius: 4px; backdrop-filter: blur(10px); border: 1px solid rgba(184, 144, 40, 0.1); }
        .hero h1 { font-family: var(--font-display); font-size: clamp(2.5rem, 5vw + 1rem, 4.5rem); font-weight: 400; color: var(--color-accent); margin-bottom: var(--space-md); line-height: 1.15; letter-spacing: -0.01em; }
        .hero p { font-size: 16px; color: var(--color-text-secondary); margin-bottom: var(--space-xl); line-height: 1.7; font-weight: 300; }
        
        .btn-primary { display: inline-flex; padding: 16px 36px; background: var(--color-primary); color: #ffffff; text-decoration: none; font-weight: 600; letter-spacing: 0.1em; font-size: 12px; text-transform: uppercase; transition: var(--transition-smooth); border: none; cursor: pointer; }
        .btn-primary:hover { transform: translateY(-4px); box-shadow: 0 15px 30px rgba(184, 144, 40, 0.2); background: var(--color-accent); color: #ffffff; }
        
        .section-header { text-align: center; margin-bottom: 50px; }
        .section-subtitle { color: var(--color-primary); text-transform: uppercase; font-size: 11px; letter-spacing: 0.25em; margin-bottom: 10px; display: block; font-weight: 600; }
        .section-title { font-family: var(--font-display); font-size: 36px; font-weight: 400; letter-spacing: 0.03em; color: var(--color-accent); }
        
        /* Akıcı Scroll Elementleri */
        .scroll-animate { 
            opacity: 0; 
            transform: translateY(40px) scale(0.98); 
            transition: opacity 1.2s var(--ease-out-expo), transform 1.2s var(--ease-out-expo); 
        }
        .scroll-animate.active { opacity: 1; transform: translateY(0) scale(1); }
        
        .section-block { padding: 90px 0; border-bottom: 1px solid rgba(184, 144, 40, 0.08); position: relative; z-index: 2; }
        .grid { display: grid; gap: var(--space-xl); grid-template-columns: repeat(3, 1fr); }
        
        /* Kart Tasarımları ve Yumuşak Hover Reaksiyonu */
        .card { 
          background: var(--color-surface); 
          border: 1px solid rgba(184, 144, 40, 0.1); 
          padding: var(--space-md); 
          transition: var(--transition-smooth); 
          display: flex; flex-direction: column; 
          position: relative;
          box-shadow: 0 4px 20px rgba(61, 53, 48, 0.02);
        }
        .card:hover { 
          transform: translateY(-12px) scale(1.01); 
          border-color: rgba(184, 144, 40, 0.4); 
          box-shadow: 0 25px 50px rgba(61, 53, 48, 0.08); 
        }
        
        .product-img-box { 
          width: 100%; height: 280px; 
          background: #fbf9f5; 
          display: flex; align-items: center; justify-content: center; 
          margin-bottom: var(--space-md); 
          color: rgba(184, 144, 40, 0.5); 
          font-family: var(--font-display); font-style: italic; font-size: 22px; 
          letter-spacing: 0.05em;
          border: 1px solid rgba(184, 144, 40, 0.05);
          transition: var(--transition-smooth);
          overflow: hidden;
        }
        .card:hover .product-img-box { color: var(--color-primary); background: #f7f4ee; transform: scale(0.99); }
        
        .product-title { font-family: var(--font-display); font-size: 24px; font-weight: 400; margin-bottom: 8px; color: var(--color-accent); letter-spacing: 0.02em; }
        .product-desc { font-size: 13px; color: var(--color-text-secondary); line-height: 1.6; margin-bottom: var(--space-md); flex-grow: 1; font-weight: 300; }
        .product-footer { display: flex; justify-content: space-between; align-items: center; padding-top: var(--space-md); border-top: 1px solid rgba(184, 144, 40, 0.1); }
        .product-price { font-weight: 600; color: var(--color-primary); font-size: 18px; font-family: var(--font-body); }
        
        .btn-add-cart { background: transparent; border: 1px solid rgba(184, 144, 40, 0.3); color: var(--color-primary); padding: 10px 22px; font-size: 12px; cursor: pointer; transition: var(--transition-smooth); font-weight: 600; letter-spacing: 0.05em; }
        .btn-add-cart:hover { background: var(--color-primary); color: #ffffff; transform: scale(1.05); }
        
        /* Hakkımızda Bölümü */
        .about-content { max-width: 800px; margin: 0 auto; text-align: center; }
        .about-content p { font-size: 16px; color: var(--color-text-secondary); line-height: 1.9; font-weight: 300; margin-bottom: var(--space-lg); }
        .about-content em { font-family: var(--font-display); font-size: 22px; color: var(--color-primary); display: block; margin-top: var(--space-md); font-style: italic; }
        
        /* Müşteri Yorumları */
        .reviews-grid { display: grid; gap: var(--space-lg); grid-template-columns: repeat(3, 1fr); }
        .review-card { background: var(--color-surface); border: 1px solid rgba(184, 144, 40, 0.06); padding: var(--space-lg); transition: var(--transition-smooth); box-shadow: 0 4px 15px rgba(61, 53, 48, 0.01); }
        .review-card:hover { transform: translateY(-5px); border-color: rgba(184, 144, 40, 0.2); box-shadow: 0 15px 30px rgba(61, 53, 48, 0.05); }
        .stars { color: var(--color-primary); font-size: 13px; margin-bottom: 14px; letter-spacing: 3px; }
        .review-text { font-size: 14px; color: var(--color-text-secondary); line-height: 1.7; font-style: italic; margin-bottom: var(--space-md); font-weight: 300; }
        .review-user { display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 36px; height: 36px; background: #fdfbf7; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--color-primary); font-weight: 600; border: 1px solid rgba(184, 144, 40, 0.2); }
        .user-name { font-size: 14px; font-weight: 500; color: var(--color-accent); }
        
        /* Footer */
        .footer { background: #f7f4ee; border-top: 1px solid rgba(184, 144, 40, 0.1); padding: 70px 0 35px 0; color: var(--color-text-secondary); position: relative; z-index: 2; }
        .footer-grid { display: grid; grid-template-columns: 1.2fr 1fr 1.3fr; gap: var(--space-xl); margin-bottom: 40px; }
        .footer-col h4 { font-family: var(--font-display); font-size: 22px; color: var(--color-accent); margin-bottom: var(--space-lg); font-weight: 400; letter-spacing: 0.03em; }
        .footer-col p { font-size: 14px; line-height: 1.7; margin-bottom: 12px; font-weight: 300; }
        .map-box { width: 100%; height: 160px; background: var(--color-surface); border: 1px solid rgba(184, 144, 40, 0.12); display: flex; align-items: center; justify-content: center; }
        .map-placeholder { text-align: center; font-size: 13px; color: var(--color-primary); padding: var(--space-md); line-height: 1.6; font-family: var(--font-display); }
        .footer-bottom { text-align: center; padding-top: 35px; border-top: 1px solid rgba(184, 144, 40, 0.08); font-size: 12px; letter-spacing: 0.02em; opacity: 0.6; }
        
        /* Sepet Alanı Perde Efekti */
        .cart-sidebar { 
            position: fixed; 
            top: 0; right: -440px; 
            width: 420px; height: 100%; 
            background: #ffffff; 
            border-left: 1px solid rgba(184, 144, 40, 0.15); 
            z-index: 200; 
            padding: var(--space-xl); 
            display: flex; flex-direction: column; 
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), right 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: -15px 0 40px rgba(61, 53, 48, 0.06); 
        }
        .cart-sidebar.open { right: 0; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-xl); border-bottom: 1px solid rgba(184, 144, 40, 0.1); padding-bottom: var(--space-md); }
        .cart-header h3 { font-family: var(--font-display); font-size: 26px; color: var(--color-accent); font-weight: 400; }
        .close-cart { background: transparent; border: none; color: var(--color-accent); font-size: 24px; cursor: pointer; padding: 5px; transition: color 0.3s; }
        .close-cart:hover { color: var(--color-primary); }
        .cart-items { flex-grow: 1; overflow-y: auto; }
        
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: var(--space-md) 0; border-bottom: 1px solid rgba(184, 144, 40, 0.06); transition: var(--transition-smooth); }
        .cart-item-info h4 { font-family: var(--font-display); font-size: 18px; color: var(--color-accent); margin-bottom: 4px; font-weight: 400; }
        .cart-item-info span { font-size: 14px; color: var(--color-primary); font-weight: 500; }
        
        .quantity-control { display: flex; align-items: center; background: #fdfbf7; border: 1px solid rgba(184, 144, 40, 0.2); border-radius: 4px; overflow: hidden; }
        .qty-btn { background: transparent; border: none; color: var(--color-accent); width: 30px; height: 30px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
        .qty-btn:hover { background: rgba(184, 144, 40, 0.05); color: var(--color-primary); }
        .qty-val { width: 32px; text-align: center; font-size: 13px; font-weight: 600; color: var(--color-accent); }
        
        .gift-section {
            margin: var(--space-lg) 0;
            padding: var(--space-md);
            background: rgba(184, 144, 40, 0.02);
            border: 1px dashed rgba(184, 144, 40, 0.25);
            border-radius: 4px;
        }
        .gift-checkbox-wrapper { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13px; color: var(--color-accent); }
        .gift-checkbox-wrapper input { accent-color: var(--color-primary); width: 16px; height: 16px; cursor: pointer; }
        
        .cart-footer { border-top: 1px solid rgba(184, 144, 40, 0.1); padding-top: var(--space-md); }
        .cart-total { display: flex; justify-content: space-between; font-size: 19px; font-weight: 600; margin-bottom: var(--space-md); color: var(--color-accent); font-family: var(--font-display); }
        .btn-whatsapp { width: 100%; padding: 15px; background: #25D366; color: white; border: none; font-weight: 600; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 4px; letter-spacing: 0.02em; transition: opacity 0.3s, transform 0.2s; }
        .btn-whatsapp:active { transform: scale(0.98); }
        
        /* Akıcı Toast Bildirimi */
        .toast-notification {
            position: fixed;
            bottom: 90px; 
            left: 50%;
